<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const PRICE_LABELS = {
  gram22: "22 Ayar (gram)",
  gram24: "24 Ayar (gram)",
  ceyrek: "Çeyrek Altın",
  yarim: "Yarım Altın",
  tam: "Tam Altın",
  resat: "Reşat Altın",
};

const STORAGE_KEY = "ev-hesabi-v1";
const USERNAME_KEY = "ev-hesabi-username";

// ---------- Ortak (paylaşılan) senkronizasyon — Netlify Functions + Netlify Blobs ----------
// Ekstra hesap veya yapılandırma gerekmez: netlify/functions/data.js dosyası Netlify'a
// deploy edildiğinde bu uç nokta otomatik çalışır (Netlify Blobs, sitenize otomatik tanımlanır).
// Sadece bu index.html'i local'de (dosya olarak) açarsanız bu uç nokta yoktur — o durumda
// site otomatik olarak "sadece bu cihaz" moduna düşer.
const DATA_ENDPOINT = "/.netlify/functions/data";
const POLL_INTERVAL_MS = 8000;

async function fetchShared() {
  const res = await fetch(DATA_ENDPOINT, { cache: "no-store" });
  if (!res.ok) throw new Error("Sunucudan veri alınamadı (" + res.status + ")");
  return res.json();
}
async function saveShared(next) {
  const res = await fetch(DATA_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(next),
  });
  if (!res.ok) throw new Error("Sunucuya kaydedilemedi (" + res.status + ")");
  return res.json();
}

      gram22: 6238.65, gram24: 6888.35, ceyrek: 11184.42,
      yarim: 22368.84, tam: 44600.87, resat: 46242.62,
      lastUpdated: "2026-08-31",
    },
    debts: [
      { id: "E1", kimden: "Kemal Vural", cins: "22 Ayar Bilezik", adet: 6, gram: 119.25, tarih: "2026-02-03", birimFiyat: 6670, priceType: "gram22", not: null },
      { id: "E2", kimden: "İrfan Baba", cins: "Reşat Altın", adet: 1, gram: null, tarih: "2026-02-04", birimFiyat: 49000, priceType: "resat", not: null },
      { id: "E3", kimden: "İrfan Baba", cins: "Çeyrek Altın", adet: 15, gram: null, tarih: "2026-02-04", birimFiyat: 12155, priceType: "ceyrek", not: null },
      { id: "E4", kimden: "İrfan Baba", cins: "24 Ayar Gram Altın", adet: 10, gram: 10, tarih: null, birimFiyat: 7480, priceType: "gram24", not: null },
      { id: "E5", kimden: "İrfan Baba", cins: "24 Ayar (Hesaptaki Paranın Çevrimi)", adet: 160, gram: 160, tarih: null, birimFiyat: 7480, priceType: "gram24", not: null },
      { id: "E6", kimden: "Metin Baba", cins: "Kelepçe", adet: 1, gram: 43.61, tarih: "2026-02-03", birimFiyat: 6670, priceType: "gram22", not: null },
      { id: "E7", kimden: "Metin Baba", cins: "Çeyrek Altın", adet: 35, gram: null, tarih: null, birimFiyat: 11850, priceType: "ceyrek", not: null },
    ],

      { id: "P1", debtId: "E1", tarih: "2026-04-15", miktar: 40 },

    ],

    },

    activity: [],

  };
}

function addMonths(dateStr, n) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1 + n, d);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
}
function genInstallments(kredi) {
  const rows = [];
  for (let i = 0; i < kredi.vade; i++) {
    rows.push({
      no: i + 1,
      tarih: addMonths(kredi.ilkTaksitTarihi, i),
      tutar: kredi.taksitTutari,
      odendi: i < 4,
      odemeTarihi: i < 4 ? addMonths(kredi.ilkTaksitTarihi, i) : null,
    });
  }
  return rows;
}
function fmtTRY(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return n.toLocaleString("tr-TR", { maximumFractionDigits: 0 }) + " ₺";
}
function fmtNum(n, digits = 2) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return n.toLocaleString("tr-TR", { maximumFractionDigits: digits });
}
function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${d}.${m}.${y}`;
}
function fmtDateTime(iso) {
  // iso like "2026-08-31T16:32:00" or "2026-08-31 16:32:00"
  if (!iso) return "—";
  const [datePart, timePartRaw] = iso.replace("T", " ").split(" ");
  const [y, m, d] = datePart.split("-");
  const timePart = timePartRaw ? timePartRaw.slice(0, 5) : null;
  return timePart ? `${d}.${m}.${y} ${timePart}` : `${d}.${m}.${y}`;
}

function parseTRNumber(s) {
  if (typeof s === "number") return s;
  if (!s) return NaN;
  return parseFloat(String(s).replace(/\./g, "").replace(",", "."));
}

// Türkiye piyasası için kabaca mesai saati varsayımı: Pazartesi-Cuma 09:30-18:00.
// Kapalıçarşı/kuyumcu piyasasının gerçek çalışma saatleri günden güne değişebilir —
// bu sadece "muhtemelen mesai dışı, makas geniş olabilir" uyarısı için bir yaklaşıklıktır.
function isBusinessHours(date) {
  const day = date.getDay(); // 0 Sun .. 6 Sat
  if (day === 0 || day === 6) return false;
  const h = date.getHours() + date.getMinutes() / 60;
  return h >= 9.5 && h < 18;
}

function findKey(obj, candidates) {
  const keys = Object.keys(obj);
  for (const c of candidates) {
    const hit = keys.find((k) => k.toLocaleLowerCase("tr").trim() === c.toLocaleLowerCase("tr").trim());
    if (hit) return hit;
  }
  return null;
}

async function fetchTruncgil() {
  // Fetched via our own Netlify Function (netlify/functions/gold-price.js), not directly —
  // finans.truncgil.com does not send CORS headers, so a direct browser fetch fails silently
  // with a generic network error. A server-to-server call from our own function has no such
  // restriction (CORS is a browser-only rule), and the browser then talks to our own domain.
  const resp = await fetch("/.netlify/functions/gold-price");
  if (!resp.ok) throw new Error("Sunucudan yanıt alınamadı (" + resp.status + ")");
  const json = await resp.json();

  // Harem Altın kaynağı: fonksiyon zaten bizim anahtarlarımızla hazır fiyat döndürür.
  if (json && json._source === "haremaltin" && json.prices) {
    return {
      result: json.prices,
      usedFallback: json.fallback || {},
      guncellemeTarihiRaw: json.tarih || null,
      source: "Harem Altın",
    };
  }

  const wanted = {
    gram22: ["22 Ayar Bilezik"],
    gram24: ["Gram Altın"],
    ceyrek: ["Çeyrek Altın"],
    yarim: ["Yarım Altın"],
    tam: ["Tam Altın"],
    resat: ["Reşat Altın", "Reşat Altını", "Cumhuriyet Altını", "Ata Altın"],
  };
  const result = {};
  const usedFallback = {};
  for (const [ourKey, candidates] of Object.entries(wanted)) {
    const foundKey = findKey(json, candidates);
    if (foundKey) {
      const entry = json[foundKey];
      const satis = entry && (entry["Satış"] ?? entry["satis"] ?? entry["Satis"]);
      const alis = entry && (entry["Alış"] ?? entry["alis"] ?? entry["Alis"]);
      result[ourKey] = { satis: parseTRNumber(satis), alis: parseTRNumber(alis) };
      if (ourKey === "resat" && foundKey.toLocaleLowerCase("tr").indexOf("reşat") === -1) {
        usedFallback.resat = foundKey;
      }
    }
  }
  const guncellemeTarihiRaw = json["Güncelleme Tarihi"] || json["update_date"] || json["Update_Date"] || null;
  return { result, usedFallback, guncellemeTarihiRaw, source: "Truncgil (yedek kaynak)" };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function saveData(d) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    return true;
  } catch (e) {
    return false;
  }
}

function getUsername() {
  try { return localStorage.getItem(USERNAME_KEY); } catch (e) { return null; }
}
function setUsername(name) {
  try { localStorage.setItem(USERNAME_KEY, name); } catch (e) {}
}

// Bir ödemenin gram/adet miktarı. Yeni kayıtlar doğrudan "miktar" tutar;
// eski kayıtlar (tutar / birimFiyat) için geriye dönük hesap yapılır.
function payQty(p) {
  if (p.miktar != null) return Number(p.miktar) || 0;
  return p.birimFiyat ? p.tutar / p.birimFiyat : 0;
}

const MIG_KEMAL_SEP = "kemal-2026-09-07";

function ensureShape(d) {
  if (!d.kredi.installments) d.kredi.installments = genInstallments(d.kredi);
  if (!d.activity) d.activity = [];
  if (!d.migrations) d.migrations = [];
  // Tek seferlik: Kemal Vural'a 7 Eylül 2026'da 59,5 gram ödendi (kalan 19,75 gram).
  if (!d.migrations.includes(MIG_KEMAL_SEP)) {
    d.migrations.push(MIG_KEMAL_SEP);
    if ((d.debts || []).some((deb) => deb.id === "E1") && !(d.payments || []).some((p) => p.id === "P2" || (p.debtId === "E1" && p.tarih === "2026-09-07"))) {
      d.payments = [...(d.payments || []), { id: "P2", debtId: "E1", tarih: "2026-09-07", miktar: 59.5 }];
    }
  }
  // One-time correction: an earlier version mistakenly added a second Kemal Vural debt
  // (id "E8", "22 Ayar Bilezik (Ek Sipariş)") that never should have existed — confirmed
  // there is no such separate debt. Remove it (and any payment logged against it) from
  // whatever's already stored, so this self-heals on next load without manual cleanup.
  if (d.debts && d.debts.some((deb) => deb.id === "E8")) {
    d.debts = d.debts.filter((deb) => deb.id !== "E8");
    d.payments = (d.payments || []).filter((p) => p.debtId !== "E8");
  }
  return d;
}

function withActivity(next, by, action) {
  const entry = { by: by || "Bilinmeyen", action, at: new Date().toISOString() };
  const activity = [entry, ...(next.activity || [])].slice(0, 15);
  return { ...next, activity };
}

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return "az önce";
  if (mins < 60) return `${mins} dakika önce`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} saat önce`;
  const days = Math.round(hrs / 24);
  return `${days} gün önce`;
}

const INK = "#1C2430";
const GOLD = "#AD8A3E";
const CREAM = "#F6F1E4";
const PAPER = "#FFFDF8";
const LINE = "#DCD3B8";
const GOOD = "#4F7A5D";
const PLUM = "#8B5E83";
const STEEL = "#4F7A9E";
const DEBT_START = "2026-02-04"; // "bu borcu 4 Şubat 2026'da aldık"

function buildTrend(data) {
  const priceFor = (type) => data.goldPrices[type];
  const todayIso = new Date().toISOString().slice(0, 10);
  const events = [];

  data.debts.forEach((d) => {
    const orig = d.gram != null ? d.gram : d.adet;
    const price = priceFor(d.priceType);
    const activationDate = d.id === "E8" ? d.tarih : DEBT_START;
    events.push({ date: activationDate, cat: "emanet", delta: orig * price });
  });
  data.payments.forEach((p) => {
    const qty = payQty(p);
    const debt = data.debts.find((d) => d.id === p.debtId);
    if (!debt) return;
    const price = priceFor(debt.priceType);
    events.push({ date: p.tarih, cat: "emanet", delta: -qty * price });
  });

  events.push({ date: DEBT_START, cat: "kredi", delta: data.kredi.taksitTutari * data.kredi.vade });
  data.kredi.installments.forEach((i) => {
    if (i.odendi) events.push({ date: i.odemeTarihi || i.tarih, cat: "kredi", delta: -i.tutar });
  });

  events.push({ date: DEBT_START, cat: "avans", delta: data.avans.tutar });
  if (data.avans.odendi) events.push({ date: data.avans.odemeTarihi || DEBT_START, cat: "avans", delta: -data.avans.tutar });

  events.sort((a, b) => a.date.localeCompare(b.date));

  let emanet = 0, kredi = 0, avans = 0;
  const points = [];
  let lastDate = null;
  for (const e of events) {
    if (lastDate !== null && e.date !== lastDate) {
      points.push({ date: lastDate, emanet, kredi, avans, total: emanet + kredi + avans });
    }
    if (e.cat === "emanet") emanet += e.delta;
    if (e.cat === "kredi") kredi += e.delta;
    if (e.cat === "avans") avans += e.delta;
    lastDate = e.date;
  }
  points.push({ date: lastDate, emanet, kredi, avans, total: emanet + kredi + avans });
  if (lastDate < todayIso) {
    points.push({ date: todayIso, emanet, kredi, avans, total: emanet + kredi + avans });
  }
  return points;
}

function TrendChart({ points }) {
  const W = 720, H = 300, PAD_L = 56, PAD_R = 16, PAD_T = 16, PAD_B = 32;
  const toT = (iso) => new Date(iso).getTime();
  const minT = toT(points[0].date);
  const maxT = toT(points[points.length - 1].date);
  const maxVal = Math.max(1, ...points.map((p) => p.total)) * 1.12;

  const X = (t) => PAD_L + (maxT === minT ? 0 : ((t - minT) / (maxT - minT)) * (W - PAD_L - PAD_R));
  const Y = (v) => H - PAD_B - (v / maxVal) * (H - PAD_T - PAD_B);

  const stepPath = (key) => {
    let d = `M ${X(toT(points[0].date))} ${Y(points[0][key])}`;
    for (let i = 1; i < points.length; i++) {
      const xCur = X(toT(points[i].date));
      const yPrev = Y(points[i - 1][key]);
      const yCur = Y(points[i][key]);
      d += ` L ${xCur} ${yPrev} L ${xCur} ${yCur}`;
    }
    return d;
  };
  const areaPath = (key) => {
    const base = Y(0);
    let d = `M ${X(toT(points[0].date))} ${base} L ${X(toT(points[0].date))} ${Y(points[0][key])}`;
    for (let i = 1; i < points.length; i++) {
      const xCur = X(toT(points[i].date));
      const yPrev = Y(points[i - 1][key]);
      const yCur = Y(points[i][key]);
      d += ` L ${xCur} ${yPrev} L ${xCur} ${yCur}`;
    }
    d += ` L ${X(toT(points[points.length - 1].date))} ${base} Z`;
    return d;
  };

  const yTicks = 4;
  const gridLines = Array.from({ length: yTicks + 1 }, (_, i) => (maxVal / yTicks) * i);

  const first = points[0], last = points[points.length - 1];
  const changePct = first.total > 0 ? Math.round(((first.total - last.total) / first.total) * 100) : 0;

  return (
    <div>
      <p className="text-sm opacity-70 mb-3">
        {fmtDate(first.date)} tarihinde <strong className="tab-num">{fmtTRY(first.total)}</strong> olan toplam borcunuz,
        bugün <strong className="tab-num" style={{ color: GOLD }}>{fmtTRY(last.total)}</strong>'ye indi
        {changePct !== 0 && <> — <strong>%{Math.abs(changePct)}</strong> {changePct > 0 ? "azaldı" : "arttı"}</>}.
      </p>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="Borç azalış trendi grafiği">
        {gridLines.map((v, i) => (
          <g key={i}>
            <line x1={PAD_L} x2={W - PAD_R} y1={Y(v)} y2={Y(v)} stroke="#EDE6D0" strokeWidth="1" />
            <text x={PAD_L - 8} y={Y(v) + 4} fontSize="10" textAnchor="end" fill={INK} opacity="0.45">
              {v >= 1000000 ? (v / 1000000).toFixed(1) + "M" : Math.round(v / 1000) + "K"}
            </text>
          </g>
        ))}
        <defs>
          <linearGradient id="totalFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={GOLD} stopOpacity="0.28" />
            <stop offset="100%" stopColor={GOLD} stopOpacity="0.02" />
          </linearGradient>
        </defs>
        <path d={areaPath("total")} fill="url(#totalFill)" stroke="none" />
        <path d={stepPath("emanet")} fill="none" stroke={GOLD} strokeWidth="1.5" opacity="0.85" />
        <path d={stepPath("kredi")} fill="none" stroke={PLUM} strokeWidth="1.5" opacity="0.85" />
        <path d={stepPath("avans")} fill="none" stroke={STEEL} strokeWidth="1.5" opacity="0.85" />
        <path d={stepPath("total")} fill="none" stroke={INK} strokeWidth="2.5" />
        {points.map((p, i) => (
          <circle key={i} cx={X(toT(p.date))} cy={Y(p.total)} r="3" fill={INK}>
            <title>{fmtDate(p.date)} — {fmtTRY(p.total)}</title>
          </circle>
        ))}
        <text x={PAD_L} y={H - 8} fontSize="10" fill={INK} opacity="0.5">{fmtDate(first.date)}</text>
        <text x={W - PAD_R} y={H - 8} fontSize="10" fill={INK} opacity="0.5" textAnchor="end">{fmtDate(last.date)}</text>
      </svg>
      <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-xs opacity-70">
        <span><span className="inline-block w-2.5 h-2.5 rounded-full mr-1" style={{ background: INK }}></span>Toplam</span>
        <span><span className="inline-block w-2.5 h-2.5 rounded-full mr-1" style={{ background: GOLD }}></span>Emanetler</span>
        <span><span className="inline-block w-2.5 h-2.5 rounded-full mr-1" style={{ background: PLUM }}></span>Kredi</span>
        <span><span className="inline-block w-2.5 h-2.5 rounded-full mr-1" style={{ background: STEEL }}></span>Avans</span>
      </div>
    </div>
  );
}

function Confetti() {
  const pieces = Array.from({ length: 14 });
  const colors = [GOLD, GOOD, "#C1666B", "#4F7A9E"];
  return (
    <div className="relative w-0 h-0">
      {pieces.map((_, i) => (
        <span
          key={i}
          className="confetti-piece"
          style={{
            left: `${(i - 7) * 8}px`,
            width: 6, height: 6,
            background: colors[i % colors.length],
            borderRadius: i % 2 === 0 ? "50%" : "2px",
            animationDelay: `${i * 0.02}s`,
          }}
        />
      ))}
    </div>
  );
}

function Trophy() {
  return <span className="pop-in" title="Kapandı">🏆</span>;
}

function SectionHeader({ title, noMargin }) {
  return <h2 className={`serif text-xl ${noMargin ? "" : "mb-4"}`} style={{ color: INK }}>{title}</h2>;
}

function BreakdownCard({ emoji, label, value, sub, closed }) {
  return (
    <div className="border rounded-lg p-4 relative" style={{ borderColor: LINE, background: PAPER }}>
      <div className="flex items-center gap-1.5 text-xs opacity-60 mb-1">
        <span>{emoji}</span> {label} {closed && <Trophy />}
      </div>
      <p className="serif text-2xl tab-num" style={{ color: INK }}>{fmtTRY(value)}</p>
      <p className="text-xs opacity-50 mt-0.5">{sub}</p>
    </div>
  );
}

function MiniBar({ ratio }) {
  const pct = Math.max(0, Math.min(1, ratio)) * 100;
  return (
    <div className="w-full h-1.5 rounded-full overflow-hidden mt-1.5" style={{ background: "#EDE6D0" }}>
      <div className="h-full rounded-full" style={{ width: `${pct}%`, background: GOOD }} />
    </div>
  );
}

const GATE_PASSWORD = "gulcofurki";
const GATE_SECURITY_ANSWER = "dadaş";
const GATE_AUTH_KEY = "ev-hesabi-authed";

function PasswordGate({ onUnlock }) {
  const [pw, setPw] = useState("");
  const [error, setError] = useState(false);
  const [showForgot, setShowForgot] = useState(false);
  const [answer, setAnswer] = useState("");
  const [answerError, setAnswerError] = useState(false);
  const [revealedPw, setRevealedPw] = useState(null);

  const tryLogin = () => {
    if (pw === GATE_PASSWORD) {
      try { localStorage.setItem(GATE_AUTH_KEY, "true"); } catch (e) {}
      onUnlock();
    } else {
      setError(true);
    }
  };

  const tryAnswer = () => {
    if (answer.trim().toLocaleLowerCase("tr") === GATE_SECURITY_ANSWER) {
      setRevealedPw(GATE_PASSWORD);
      setAnswerError(false);
    } else {
      setAnswerError(true);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{ background: CREAM, color: INK }}>
      <div className="rounded-lg p-6 max-w-sm w-full" style={{ background: PAPER, border: `1px solid ${LINE}` }}>
        <p className="text-xs tracking-wide uppercase mb-1" style={{ color: GOLD }}>Ev Hesabı</p>
        <h1 className="serif text-2xl mb-4">Giriş</h1>

        {!showForgot ? (
          <>
            <input
              type="password"
              value={pw}
              onChange={(e) => { setPw(e.target.value); setError(false); }}
              onKeyDown={(e) => e.key === "Enter" && tryLogin()}
              placeholder="Şifre"
              autoFocus
              className="border rounded px-3 py-2 w-full mb-2"
              style={{ borderColor: error ? "#C1666B" : LINE }}
            />
            {error && <p className="text-sm mb-2" style={{ color: "#8C3B3B" }}>Şifre yanlış.</p>}
            <button onClick={tryLogin} className="text-sm px-4 py-2 rounded-full w-full mb-3" style={{ background: GOLD, color: "#fff" }}>
              Giriş Yap
            </button>
            <button onClick={() => setShowForgot(true)} className="text-xs opacity-60 underline w-full text-center">
              Şifremi unuttum
            </button>
          </>
        ) : (
          <>
            <p className="text-sm opacity-70 mb-3">İlk evcil hayvanınızın ismi nedir?</p>
            <input
              value={answer}
              onChange={(e) => { setAnswer(e.target.value); setAnswerError(false); }}
              onKeyDown={(e) => e.key === "Enter" && tryAnswer()}
              placeholder="Cevap"
              autoFocus
              className="border rounded px-3 py-2 w-full mb-2"
              style={{ borderColor: answerError ? "#C1666B" : LINE }}
            />
            {answerError && <p className="text-sm mb-2" style={{ color: "#8C3B3B" }}>Cevap yanlış.</p>}
            {revealedPw ? (
              <div className="text-sm rounded-lg px-3 py-2 mb-3 tab-num" style={{ background: "#F3E7CE" }}>
                Şifreniz: <strong>{revealedPw}</strong>
              </div>
            ) : (
              <button onClick={tryAnswer} className="text-sm px-4 py-2 rounded-full w-full mb-3" style={{ background: GOLD, color: "#fff" }}>
                Göster
              </button>
            )}
            <button
              onClick={() => { setShowForgot(false); setRevealedPw(null); setAnswer(""); setAnswerError(false); }}
              className="text-xs opacity-60 underline w-full text-center"
            >
              Girişe dön
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const [authed, setAuthed] = useState(() => {
    try { return localStorage.getItem(GATE_AUTH_KEY) === "true"; } catch (e) { return false; }
  });
  const [data, setData] = useState(null);
  const [openPerson, setOpenPerson] = useState({});
  const [showPaymentForm, setShowPaymentForm] = useState(false);
  const [showKrediSettings, setShowKrediSettings] = useState(false);
  const [paymentDraft, setPaymentDraft] = useState({ debtId: "", tarih: "", miktar: "" });
  const [saveState, setSaveState] = useState("idle");
  const [celebrate, setCelebrate] = useState(null); // id string when something just closed
  const [fetchingPrices, setFetchingPrices] = useState(false);
  const [fetchError, setFetchError] = useState(null);
  const [offHoursWarning, setOffHoursWarning] = useState(false);
  const [lastFetchDetail, setLastFetchDetail] = useState(null); // { alis: {...}, satis: {...}, tarih }
  const [lastGoodSnapshot, setLastGoodSnapshot] = useState(null); // last fetch taken during business hours
  const [showingSnapshot, setShowingSnapshot] = useState(false);
  const [syncStatus, setSyncStatus] = useState("connecting"); // connecting | synced | saving | error | local-only
  const [username, setUsernameState] = useState(getUsername());
  const [nameDraft, setNameDraft] = useState("");
  const [toast, setToast] = useState(null);
  const [confirmDeletePaymentId, setConfirmDeletePaymentId] = useState(null);
  const fileInputRef = useRef(null);
  const dataRef = useRef(null); // latest data, for the poll comparator without re-subscribing
  const sharedModeRef = useRef(false);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }, []);

  useEffect(() => {
    dataRef.current = data;
  }, [data]);

  useEffect(() => {
    const cached = loadData();
    if (cached) { ensureShape(cached); setData(cached); }

    try {
      const snap = localStorage.getItem("ev-hesabi-last-business-hours-snapshot");
      if (snap) setLastGoodSnapshot(JSON.parse(snap));
    } catch (e) {}

    let pollTimer = null;

    const poll = async () => {
      try {
        const remote = await fetchShared();
        sharedModeRef.current = true;
        if (remote) {
          if (!dataRef.current || remote.updatedAt !== dataRef.current.updatedAt) {
            const needsPush = !(remote.migrations || []).includes(MIG_KEMAL_SEP);
            const shaped = ensureShape(remote);
            setData(shaped);
            saveData(shaped);
            if (needsPush) saveShared({ ...shaped, updatedAt: new Date().toISOString() }).catch(() => {});
          }
        } else {
          // sunucuda henüz veri yok (ilk kullanım) — kendi verimizle başlatalım
          const seed = ensureShape(dataRef.current || cached || seedData());
          const stamped = { ...seed, updatedAt: new Date().toISOString() };
          setData(stamped);
          saveData(stamped);
          saveShared(stamped).catch(() => {});
        }
        setSyncStatus("synced");
      } catch (e) {
        if (sharedModeRef.current) {
          // was working before, now a hiccup — don't nuke the mode, just flag it
          setSyncStatus("error");
        } else {
          // never worked (function likely not deployed) — fall back to local-only
          setSyncStatus("local-only");
          if (!dataRef.current) setData(ensureShape(seedData()));
        }
      }
    };

    const startPolling = () => {
      if (pollTimer) return;
      poll();
      pollTimer = setInterval(poll, POLL_INTERVAL_MS);
    };
    const stopPolling = () => {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    };

    startPolling();
    const onVisibility = () => (document.visibilityState === "visible" ? startPolling() : stopPolling());
    document.addEventListener("visibilitychange", onVisibility);

    return () => {
      stopPolling();
      document.removeEventListener("visibilitychange", onVisibility);
    };
  }, []);

  const persist = useCallback((next, actionLabel) => {
    const withLog = actionLabel ? withActivity(next, username, actionLabel) : next;
    const stamped = { ...withLog, updatedAt: new Date().toISOString() };
    setData(stamped);
    saveData(stamped);
    if (sharedModeRef.current) {
      setSyncStatus("saving");
      saveShared(stamped)
        .then(() => setSyncStatus("synced"))
        .catch(() => setSyncStatus("error"));
    } else {
      setSaveState("saved");
      setTimeout(() => setSaveState("idle"), 1200);
    }
  }, [username]);

  const saveUsername = () => {
    const name = nameDraft.trim();
    if (!name) return;
    setUsername(name);
    setUsernameState(name);
  };

  const calc = useMemo(() => {
    if (!data) return null;
    const paidQty = {};
    for (const p of data.payments) {
      const q = payQty(p);
      paidQty[p.debtId] = (paidQty[p.debtId] || 0) + q;
    }
    const debtRows = data.debts.map((d) => {
      const original = d.gram != null ? d.gram : d.adet;
      const paid = paidQty[d.id] || 0;
      const kalan = Math.max(0, original - paid);
      const price = data.goldPrices[d.priceType];
      const kalanValue = kalan * price;
      const unit = d.gram != null ? "gram" : "adet";
      return { ...d, original, paid, kalan, price, kalanValue, unit, ratio: original ? paid / original : 0 };
    });
    const byPerson = {};
    for (const r of debtRows) {
      byPerson[r.kimden] = byPerson[r.kimden] || { items: [], total: 0 };
      byPerson[r.kimden].items.push(r);
      byPerson[r.kimden].total += r.kalanValue;
    }
    const emanetTotal = debtRows.reduce((s, r) => s + r.kalanValue, 0);

    const installments = data.kredi.installments;
    const odenenSayisi = installments.filter((i) => i.odendi).length;
    const kalanSayisi = data.kredi.vade - odenenSayisi;
    const odenenTutar = installments.filter((i) => i.odendi).reduce((s, i) => s + i.tutar, 0);
    const toplamGeriOdeme = data.kredi.taksitTutari * data.kredi.vade;
    const krediKalan = toplamGeriOdeme - odenenTutar;

    const avansKalan = data.avans.odendi ? 0 : data.avans.tutar;
    const toplamKalanBorc = emanetTotal + avansKalan + krediKalan;

    return { debtRows, byPerson, emanetTotal, odenenSayisi, kalanSayisi, odenenTutar, toplamGeriOdeme, krediKalan, avansKalan, toplamKalanBorc };
  }, [data]);

  const trendPoints = useMemo(() => (data ? buildTrend(data) : null), [data]);

  if (!authed) {
    return <PasswordGate onUnlock={() => setAuthed(true)} />;
  }

  if (!data || !calc) {
    return <div className="min-h-screen flex items-center justify-center" style={{ background: CREAM }}>
      <p className="text-sm opacity-60">Yükleniyor…</p>
    </div>;
  }

  const updatePrice = (key, val) => {
    persist({ ...data, goldPrices: { ...data.goldPrices, [key]: parseFloat(val) || 0, lastUpdated: new Date().toISOString().slice(0, 10) } },
      `${PRICE_LABELS[key]} fiyatını elle güncelledi`);
  };

  const fetchLivePrices = async () => {
    setFetchingPrices(true);
    setFetchError(null);
    setShowingSnapshot(false);
    try {
      const { result, usedFallback, guncellemeTarihiRaw, source } = await fetchTruncgil();
      const now = guncellemeTarihiRaw ? new Date(guncellemeTarihiRaw.replace(" ", "T")) : new Date();
      const withinHours = isBusinessHours(now);
      setOffHoursWarning(!withinHours);

      const lastUpdatedIso = (guncellemeTarihiRaw ? guncellemeTarihiRaw.slice(0, 19) : new Date().toISOString().slice(0, 19)).replace(" ", "T");

      const nextPrices = { ...data.goldPrices, lastUpdated: lastUpdatedIso };
      const detail = {};
      for (const key of Object.keys(PRICE_LABELS)) {
        if (result[key] && !isNaN(result[key].satis)) {
          nextPrices[key] = result[key].satis;
          detail[key] = result[key];
        }
      }
      setLastFetchDetail({ detail, tarih: lastUpdatedIso, usedFallback, withinHours, source });

      const next = { ...data, goldPrices: nextPrices };
      persist(next, "Canlı altın fiyatlarını çekti");
      showToast("Fiyatlar güncellendi");

      if (withinHours) {
        const snapshot = { goldPrices: nextPrices, tarih: lastUpdatedIso };
        try {
          localStorage.setItem("ev-hesabi-last-business-hours-snapshot", JSON.stringify(snapshot));
          setLastGoodSnapshot(snapshot);
        } catch (e) {}
      }
    } catch (e) {
      setFetchError("Canlı fiyatlar çekilemedi (bağlantı ya da kaynak sorunu olabilir). Fiyatları elle girebilir ya da tekrar deneyebilirsiniz.");
    } finally {
      setFetchingPrices(false);
    }
  };

  const showLastGoodSnapshot = () => {
    if (!lastGoodSnapshot) return;
    setShowingSnapshot(true);
    persist({ ...data, goldPrices: { ...lastGoodSnapshot.goldPrices } }, "Son mesai içi fiyat kaydına döndü");
  };

  const toggleInstallment = (no) => {
    const wasAllPaid = calc.kalanSayisi === 0;
    const installments = data.kredi.installments.map((i) =>
      i.no === no ? { ...i, odendi: !i.odendi, odemeTarihi: !i.odendi ? i.tarih : null } : i
    );
    const target = installments.find((i) => i.no === no);
    const nowAllPaid = installments.every((i) => i.odendi);
    if (!wasAllPaid && nowAllPaid) {
      setCelebrate("kredi");
      setTimeout(() => setCelebrate(null), 1200);
    }
    persist({ ...data, kredi: { ...data.kredi, installments } },
      `${no}. taksiti ${target.odendi ? "ödendi" : "ödenmedi"} işaretledi`);
  };

  const updateKredi = (field, val) => {
    const nextVal = field === "ilkTaksitTarihi" ? val : parseFloat(val) || 0;
    if (field === "vade") {
      const droppedPaidCount = data.kredi.installments.filter((inst, idx) => idx >= nextVal && inst.odendi).length;
      if (droppedPaidCount > 0) {
        const ok = window.confirm(
          `Vadeyi ${nextVal} aya düşürürseniz, zaten ödenmiş işaretlediğiniz ${droppedPaidCount} taksitin kaydı silinecek. Devam etmek istiyor musunuz?`
        );
        if (!ok) return;
      }
    }
    const nextKredi = { ...data.kredi, [field]: nextVal };
    nextKredi.installments = genInstallments(nextKredi).map((row, idx) => {
      const existing = data.kredi.installments[idx];
      return existing ? { ...row, odendi: existing.odendi, odemeTarihi: existing.odendi ? row.tarih : null } : row;
    });
    persist({ ...data, kredi: nextKredi }, "Kredi ayarlarını güncelledi");
  };

  const toggleAvans = () => {
    const odendi = !data.avans.odendi;
    if (odendi) { setCelebrate("avans"); setTimeout(() => setCelebrate(null), 1200); }
    persist({ ...data, avans: { ...data.avans, odendi, odemeTarihi: odendi ? (data.avans.odemeTarihi || new Date().toISOString().slice(0, 10)) : null } },
      odendi ? "Avansı ödendi işaretledi" : "Avansı ödenmedi işaretledi");
  };

  const addPayment = () => {
    const miktar = parseFloat(String(paymentDraft.miktar).replace(",", "."));
    if (!paymentDraft.debtId || !paymentDraft.tarih || !(miktar > 0)) return;
    const p = { id: "P" + Date.now(), debtId: paymentDraft.debtId, tarih: paymentDraft.tarih, miktar };
    const nextData = { ...data, payments: [...data.payments, p] };

    // celebrate if this closes out the person's full debt
    const paidQty = {};
    for (const pay of nextData.payments) {
      const q = payQty(pay);
      paidQty[pay.debtId] = (paidQty[pay.debtId] || 0) + q;
    }
    const debt = nextData.debts.find((d) => d.id === p.debtId);
    if (debt) {
      const personDebts = nextData.debts.filter((d) => d.kimden === debt.kimden);
      const personFullyPaid = personDebts.every((d) => {
        const orig = d.gram != null ? d.gram : d.adet;
        const paid = paidQty[d.id] || 0;
        return paid >= orig - 0.001;
      });
      if (personFullyPaid) { setCelebrate(debt.kimden); setTimeout(() => setCelebrate(null), 1200); }
    }

    persist(nextData, debt ? `${debt.kimden}'a ${fmtNum(p.miktar)} ${debt.gram != null ? "gram" : "adet"} ödeme ekledi` : "Ödeme ekledi");
    showToast("Ödeme kaydedildi");
    setPaymentDraft({ debtId: "", tarih: "", miktar: "" });
    setShowPaymentForm(false);
  };

  const removePayment = (id) => {
    const p = data.payments.find((x) => x.id === id);
    const debt = p && data.debts.find((d) => d.id === p.debtId);
    persist({ ...data, payments: data.payments.filter((x) => x.id !== id) },
      debt ? `${debt.kimden} — ${debt.cins} ödemesini sildi` : "Bir ödemeyi sildi");
    showToast("Ödeme silindi");
  };
  const requestRemovePayment = (id) => setConfirmDeletePaymentId(id);
  const togglePerson = (name) => setOpenPerson((o) => ({ ...o, [name]: !o[name] }));

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `ev-hesabi-yedek-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = ensureShape(JSON.parse(e.target.result));
        persist(parsed, "Yedekten geri yükledi");
      } catch (err) { alert("Dosya okunamadı — geçerli bir yedek JSON dosyası seçin."); }
    };
    reader.readAsText(file);
  };

  const draftDebt = data && data.debts.find((d) => d.id === paymentDraft.debtId);
  const draftUnit = draftDebt ? (draftDebt.gram != null ? "gram" : "adet") : "gram/adet";
  const draftRow = calc && calc.debtRows ? calc.debtRows.find((r) => r.id === paymentDraft.debtId) : null;
  const draftMiktar = parseFloat(String(paymentDraft.miktar).replace(",", "."));
  const draftKalan = draftRow && draftMiktar > 0 ? Math.max(0, draftRow.kalan - draftMiktar) : null;

  const syncLabel = {
    connecting: "🟡 Bağlanıyor…",
    synced: "🟢 Senkronize — eşinizle ortak",
    saving: "🟡 Kaydediliyor…",
    error: "🔴 Bağlantı sorunu — yerel kopya gösteriliyor",
    "local-only": "⚪ Sadece bu cihazda (ortak senkronizasyon kapalı)",
  }[syncStatus];

  return (
    <div className="min-h-screen" style={{ background: CREAM, color: INK }}>

      {!username && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6" style={{ background: "rgba(28,36,48,0.5)" }}>
          <div className="rounded-lg p-6 max-w-sm w-full" style={{ background: PAPER }}>
            <h2 className="serif text-xl mb-2">Önce adınızı alalım</h2>
            <p className="text-sm opacity-70 mb-4">
              Bu sadece bu cihazda saklanır ve kim ne değiştirdiğini görebilmeniz için değişiklik geçmişinde kullanılır.
            </p>
            <input
              autoFocus
              value={nameDraft}
              onChange={(e) => setNameDraft(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && saveUsername()}
              placeholder="Örn. Furkan"
              className="border rounded px-3 py-2 w-full mb-3"
              style={{ borderColor: LINE }}
            />
            <button onClick={saveUsername} className="text-sm px-4 py-2 rounded-full w-full" style={{ background: GOLD, color: "#fff" }}>
              Devam Et
            </button>
          </div>
        </div>
      )}

      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 text-sm px-4 py-2 rounded-full shadow-lg"
             style={{ background: INK, color: CREAM }}>
          {toast}
        </div>
      )}

      {confirmDeletePaymentId && (() => {
        const p = data.payments.find((x) => x.id === confirmDeletePaymentId);
        const debt = p && data.debts.find((d) => d.id === p.debtId);
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-6" style={{ background: "rgba(28,36,48,0.5)" }}>
            <div className="rounded-lg p-6 max-w-sm w-full" style={{ background: PAPER }}>
              <h2 className="serif text-xl mb-2">Ödemeyi sil?</h2>
              <p className="text-sm opacity-70 mb-4">
                {debt ? `${debt.kimden} — ${debt.cins}` : "Bu ödeme"} kaydını ({p ? `${fmtNum(payQty(p))} ${debt && debt.gram == null ? "adet" : "gram"}` : ""}, {p ? fmtDate(p.tarih) : ""}) silmek
                istediğinize emin misiniz? Bu işlem geri alınamaz.
              </p>
              <div className="flex gap-2">
                <button
                  onClick={() => { removePayment(confirmDeletePaymentId); setConfirmDeletePaymentId(null); }}
                  className="text-sm px-4 py-2 rounded-full flex-1"
                  style={{ background: "#8C3B3B", color: "#fff" }}
                >
                  Evet, Sil
                </button>
                <button
                  onClick={() => setConfirmDeletePaymentId(null)}
                  className="text-sm px-4 py-2 rounded-full flex-1 border"
                  style={{ borderColor: LINE }}
                >
                  Vazgeç
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Sticky header */}
      <header className="sticky top-0 z-10 border-b backdrop-blur" style={{ borderColor: LINE, background: "rgba(246,241,228,0.92)" }}>
        <div className="max-w-4xl mx-auto px-6 py-6 flex items-end justify-between flex-wrap gap-3">
          <div>
            <p className="text-xs tracking-wide uppercase mb-1" style={{ color: GOLD }}>Ev Hesabı</p>
            <h1 className="serif text-2xl md:text-3xl">Kalan Borç Takibi</h1>
            <p className="text-xs opacity-50 mt-1">{syncLabel}{username && ` · ${username} olarak`}</p>
          </div>
          <div className="text-right">
            <p className="text-xs opacity-60">Toplam kalan borç</p>
            <p className="serif text-2xl md:text-3xl tab-num" style={{ color: GOLD }}>{fmtTRY(calc.toplamKalanBorc)}</p>
          </div>
        </div>
      </header>

      <main className="max-w-4xl mx-auto px-6 py-8 space-y-10">

        <section className="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <BreakdownCard emoji="🪙" label="Emanetler" value={calc.emanetTotal} sub="3 kişiye borç" closed={calc.emanetTotal < 1} />
          <div className="relative">
            {celebrate === "avans" && <Confetti />}
            <BreakdownCard emoji="🤝" label="Avans (Insider)" value={calc.avansKalan} sub={data.avans.odendi ? "Ödendi" : "Ödenmedi"} closed={data.avans.odendi} />
          </div>
          <div className="relative">
            {celebrate === "kredi" && <Confetti />}
            <BreakdownCard emoji="🏦" label="Kredi (Garanti)" value={calc.krediKalan} sub={`${calc.odenenSayisi} / ${data.kredi.vade} taksit ödendi`} closed={calc.kalanSayisi === 0} />
          </div>
        </section>

        {/* Trend chart */}
        {trendPoints && trendPoints.length > 1 && (
          <section>
            <SectionHeader title="Borç Azalış Trendi" />
            <div className="border rounded-lg p-4" style={{ borderColor: LINE, background: PAPER }}>
              <TrendChart points={trendPoints} />
            </div>
            <p className="text-xs opacity-50 mt-2">
              Bugünkü altın fiyatları sabit tutularak hesaplanmıştır — yani grafikteki değişim piyasa dalgalanmasından değil,
              yaptığınız ödemelerden kaynaklanır.
            </p>
          </section>
        )}

        {/* Gold prices */}
        <section>
          <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
            <SectionHeader title="Güncel Altın Fiyatları" noMargin />
            <div className="flex items-center gap-2 flex-wrap">
              <button onClick={fetchLivePrices} disabled={fetchingPrices}
                className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-full disabled:opacity-50"
                style={{ background: INK, color: CREAM }}>
                {fetchingPrices ? "Çekiliyor…" : "Canlı Fiyatı Çek"}
              </button>
              <a href="https://altin.doviz.com/gram-altin" target="_blank" rel="noopener noreferrer"
                 className="text-xs px-3 py-1.5 rounded-full border" style={{ borderColor: LINE }}>
                Elle Kontrol Et ↗
              </a>
            </div>
          </div>
          <p className="text-sm opacity-70 my-3">
            ℹ️ "Canlı Fiyatı Çek" piyasadan <strong>satış</strong> fiyatını otomatik çeker (borcu kapatmak için altın almanız gerekseydi ödeyeceğiniz fiyat).
            Ödemeler gram/adet olarak kaydedilir; kalan borcun TL karşılığı her zaman güncel fiyatla hesaplanır.
            Son güncelleme: {fmtDateTime(data.goldPrices.lastUpdated)}{lastFetchDetail && lastFetchDetail.source ? ` · Kaynak: ${lastFetchDetail.source}` : ""}
            {showingSnapshot && <span> · <em>son mesai içi kayıt gösteriliyor</em></span>}.
          </p>

          {fetchError && <p className="text-sm mb-3" style={{ color: "#8C3B3B" }}>{fetchError}</p>}

          {offHoursWarning && (
            <div className="text-sm rounded-lg px-4 py-3 mb-3 flex items-start gap-2" style={{ background: "#FBF0DA", border: "1px solid #E4C989", color: "#7A5B1E" }}>
              <span>⚠️</span>
              <span>
                Bu veri mesai saatleri dışında çekildi, bu yüzden alış-satış makası normalden açık olabilir — piyasa tam işlemediği için fiyat
                tam güvenilir olmayabilir. Mesai saatlerinde (hafta içi 09:30–18:00 civarı) tekrar kontrol etmenizi öneririz.
                {lastGoodSnapshot && (
                  <>
                    {" "}Bu arada en son mesai içinde alınan güvenilir fiyatı görmek için{" "}
                    <button onClick={showLastGoodSnapshot} className="underline font-medium">buraya tıklayın</button>
                    {" "}({fmtDateTime(lastGoodSnapshot.tarih)}).
                  </>
                )}
              </span>
            </div>
          )}

          {!offHoursWarning && lastGoodSnapshot && !showingSnapshot && (
            <button onClick={showLastGoodSnapshot} className="text-xs opacity-60 underline mb-3 block">
              Son mesai içi kaydı göster ({fmtDateTime(lastGoodSnapshot.tarih)})
            </button>
          )}

          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
            {Object.keys(PRICE_LABELS).map((key) => {
              const d = lastFetchDetail && lastFetchDetail.detail[key];
              return (
              <label key={key} className="border rounded-lg px-3 py-2 flex flex-col gap-1" style={{ borderColor: LINE, background: PAPER }}>
                <span className="text-xs opacity-60">{PRICE_LABELS[key]} (₺{key === "gram22" || key === "gram24" ? "/gram" : "/adet"})</span>
                <div className="flex items-baseline gap-1">
                  <input type="number" value={data.goldPrices[key]} onChange={(e) => updatePrice(key, e.target.value)}
                    className="tab-num bg-transparent outline-none text-lg serif w-full" style={{ color: INK }} />
                  <span className="text-lg serif opacity-70 shrink-0">₺</span>
                </div>
                {d && !isNaN(d.alis) && (
                  <span className="text-xs opacity-45 tab-num">Alış {fmtNum(d.alis)} · Satış {fmtNum(d.satis)}</span>
                )}
                {lastFetchDetail && lastFetchDetail.usedFallback && lastFetchDetail.usedFallback[key] && (
                  <span className="text-xs opacity-45 italic">"{lastFetchDetail.usedFallback[key]}" fiyatı kullanıldı (Reşat bulunamadı)</span>
                )}
              </label>
            );})}
          </div>
        </section>

        {/* Emanetler */}
        <section>
          <SectionHeader title="Emanetler — Kişi Bazında Kalan Borç" />
          <div className="space-y-3">
            {Object.entries(calc.byPerson).map(([name, group]) => {
              const closed = group.total < 1;
              return (
              <div key={name} className="border rounded-lg overflow-hidden relative" style={{ borderColor: LINE, background: PAPER }}>
                {celebrate === name && <div className="absolute right-4 top-3"><Confetti /></div>}
                <button onClick={() => togglePerson(name)} className="w-full flex items-center justify-between px-4 py-3 text-left">
                  <span className="flex items-center gap-2">
                    <span className="opacity-50">{openPerson[name] ? "▾" : "▸"}</span>
                    <span className="font-medium">{name}</span>
                    {closed && <Trophy />}
                  </span>
                  <span className="serif text-lg tab-num" style={{ color: closed ? GOOD : GOLD }}>{fmtTRY(group.total)}</span>
                </button>
                {openPerson[name] && (
                  <div className="px-4 pb-4 space-y-3 border-t" style={{ borderColor: "#EDE6D0" }}>
                    {group.items.map((it) => (
                      <div key={it.id} className="text-sm pt-3">
                        <div className="flex items-center justify-between">
                          <div>
                            <p>{it.cins} {it.kalan < 0.01 && <Trophy />}</p>
                            <p className="opacity-60 text-xs">
                              Kalan: {fmtNum(it.kalan)} {it.unit} / {fmtNum(it.original)} {it.unit} · {fmtDate(it.tarih)} tarihli, {fmtTRY(it.birimFiyat)}/{it.unit}
                            </p>
                            {it.not && <p className="opacity-50 text-xs italic mt-0.5">{it.not}</p>}
                          </div>
                          <p className="tab-num shrink-0 pl-3">{fmtTRY(it.kalanValue)}</p>
                        </div>
                        <MiniBar ratio={it.ratio} />
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );})}
          </div>
        </section>

        {/* Payments */}
        <section>
          <div className="flex items-center justify-between mb-4">
            <SectionHeader title="Ödeme Geçmişi" noMargin />
            <button onClick={() => setShowPaymentForm((s) => !s)} className="flex items-center gap-1 text-sm px-3 py-1.5 rounded-full" style={{ background: INK, color: CREAM }}>
              + Ödeme Ekle
            </button>
          </div>

          {showPaymentForm && (
            <div className="border rounded-lg p-4 mb-4 space-y-3" style={{ borderColor: LINE, background: PAPER }}>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <label className="flex flex-col gap-1 text-sm">
                  <span className="opacity-60 text-xs">Hangi Borç</span>
                  <select value={paymentDraft.debtId} onChange={(e) => setPaymentDraft((d) => ({ ...d, debtId: e.target.value }))}
                    className="border rounded px-2 py-1.5" style={{ borderColor: LINE }}>
                    <option value="">Seçin…</option>
                    {data.debts.map((d) => <option key={d.id} value={d.id}>{d.kimden} — {d.cins}</option>)}
                  </select>
                </label>
                <label className="flex flex-col gap-1 text-sm">
                  <span className="opacity-60 text-xs">Ödeme Tarihi</span>
                  <input type="date" value={paymentDraft.tarih} onChange={(e) => setPaymentDraft((d) => ({ ...d, tarih: e.target.value }))}
                    className="border rounded px-2 py-1.5" style={{ borderColor: LINE }} />
                </label>
                <label className="flex flex-col gap-1 text-sm sm:col-span-2">
                  <span className="opacity-60 text-xs">Ödenen Miktar ({draftUnit})</span>
                  <input type="number" inputMode="decimal" step="any" min="0" value={paymentDraft.miktar} onChange={(e) => setPaymentDraft((d) => ({ ...d, miktar: e.target.value }))}
                    className="border rounded px-2 py-1.5 tab-num" style={{ borderColor: LINE }} placeholder="örn. 59,5" />
                </label>
              </div>
              <p className="text-xs opacity-60">{draftKalan != null ? `Bu ödemeden sonra kalan: ${fmtNum(draftKalan)} ${draftUnit}` : "Yalnızca ödenen gram/adet girilir."}</p>
              <div className="flex gap-2">
                <button onClick={addPayment} className="text-sm px-4 py-1.5 rounded-full" style={{ background: GOLD, color: "#fff" }}>Kaydet</button>
                <button onClick={() => setShowPaymentForm(false)} className="text-sm px-4 py-1.5 rounded-full border" style={{ borderColor: LINE }}>Vazgeç</button>
              </div>
            </div>
          )}

          <div className="space-y-2">
            {data.payments.length === 0 && <p className="text-sm opacity-50">Henüz ödeme kaydı yok.</p>}
            {data.payments.map((p) => {
              const debt = data.debts.find((d) => d.id === p.debtId);
              const miktar = payQty(p);
              const unit = debt && debt.gram == null ? "adet" : "gram";
              return (
                <div key={p.id} className="flex items-center justify-between text-sm border-b py-2" style={{ borderColor: "#EDE6D0" }}>
                  <div>
                    <p>{debt ? `${debt.kimden} — ${debt.cins}` : p.debtId}</p>
                    <p className="opacity-60 text-xs">{fmtDate(p.tarih)}</p>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="tab-num">{fmtNum(miktar)} {unit}</span>
                    <button onClick={() => requestRemovePayment(p.id)} className="opacity-40 hover:opacity-80" title="Sil">✕</button>
                  </div>
                </div>
              );
            })}
          </div>
        </section>

        {/* Kredi */}
        <section>
          <div className="flex items-center justify-between mb-1">
            <SectionHeader title="Kredi Takibi — Garanti Bankası" noMargin />
            <button onClick={() => setShowKrediSettings((s) => !s)} className="text-xs opacity-60 underline">
              {showKrediSettings ? "Ayarları Gizle" : "Ayarları Düzenle"}
            </button>
          </div>

          {showKrediSettings && (
            <div className="border rounded-lg p-4 mb-4 grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm" style={{ borderColor: LINE, background: PAPER }}>
              <label className="flex flex-col gap-1">
                <span className="opacity-60 text-xs">Anapara</span>
                <input type="number" defaultValue={data.kredi.anapara} onBlur={(e) => updateKredi("anapara", e.target.value)} className="border rounded px-2 py-1 tab-num" style={{ borderColor: LINE }} />
              </label>
              <label className="flex flex-col gap-1">
                <span className="opacity-60 text-xs">Vade (ay)</span>
                <input type="number" defaultValue={data.kredi.vade} onBlur={(e) => updateKredi("vade", e.target.value)} className="border rounded px-2 py-1 tab-num" style={{ borderColor: LINE }} />
              </label>
              <label className="flex flex-col gap-1">
                <span className="opacity-60 text-xs">Taksit Tutarı</span>
                <input type="number" defaultValue={data.kredi.taksitTutari} onBlur={(e) => updateKredi("taksitTutari", e.target.value)} className="border rounded px-2 py-1 tab-num" style={{ borderColor: LINE }} />
              </label>
              <label className="flex flex-col gap-1">
                <span className="opacity-60 text-xs">İlk Taksit Tarihi</span>
                <input type="date" defaultValue={data.kredi.ilkTaksitTarihi} onBlur={(e) => updateKredi("ilkTaksitTarihi", e.target.value)} className="border rounded px-2 py-1" style={{ borderColor: LINE }} />
              </label>
            </div>
          )}

          <div className="border rounded-lg p-4 mb-4" style={{ borderColor: LINE, background: PAPER }}>
            <div className="flex items-center justify-between text-sm mb-2">
              <span>{calc.odenenSayisi} / {data.kredi.vade} taksit ödendi {calc.kalanSayisi === 0 && <Trophy />}</span>
              <span className="opacity-60">{fmtTRY(data.kredi.taksitTutari)} / ay</span>
            </div>
            <div className="w-full h-2 rounded-full overflow-hidden" style={{ background: "#EDE6D0" }}>
              <div className="h-full rounded-full transition-all duration-500" style={{ width: `${(calc.odenenSayisi / data.kredi.vade) * 100}%`, background: calc.kalanSayisi === 0 ? GOOD : GOLD }} />
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-4 text-sm">
              <div><p className="opacity-60 text-xs">Kalan taksit</p><p className="tab-num">{calc.kalanSayisi}</p></div>
              <div><p className="opacity-60 text-xs">Ödenen tutar</p><p className="tab-num">{fmtTRY(calc.odenenTutar)}</p></div>
              <div><p className="opacity-60 text-xs">Kalan kredi borcu</p><p className="tab-num serif" style={{ color: GOLD }}>{fmtTRY(calc.krediKalan)}</p></div>
            </div>
          </div>

          <div className="grid grid-cols-3 sm:grid-cols-7 gap-2">
            {data.kredi.installments.map((i) => (
              <button key={i.no} onClick={() => toggleInstallment(i.no)}
                className="border rounded-lg p-2 flex flex-col items-center gap-1 text-xs transition-colors"
                style={{ borderColor: i.odendi ? GOLD : LINE, background: i.odendi ? "#F3E7CE" : PAPER }}
                title={fmtDate(i.tarih)}>
                <span>{i.odendi ? "✓" : "○"}</span>
                <span className="tab-num">{fmtDate(i.tarih)}</span>
              </button>
            ))}
          </div>
        </section>

        {/* Avans */}
        <section>
          <SectionHeader title="Avans — Insider One" />
          <div className="border rounded-lg p-4 flex items-center justify-between relative" style={{ borderColor: LINE, background: PAPER }}>
            <div>
              <p className="text-sm">{fmtTRY(data.avans.tutar)}</p>
              <p className="text-xs opacity-60">{data.avans.odendi ? `Ödendi — ${fmtDate(data.avans.odemeTarihi)}` : "Ödenmedi"}</p>
            </div>
            <button onClick={toggleAvans} className="text-sm px-4 py-1.5 rounded-full border flex items-center gap-1.5"
              style={{ borderColor: GOLD, color: data.avans.odendi ? "#fff" : GOLD, background: data.avans.odendi ? GOLD : "transparent" }}>
              {data.avans.odendi ? "✓ Ödendi" : "○ Ödendi işaretle"}
            </button>
          </div>
        </section>

        {/* Activity feed */}
        {data.activity && data.activity.length > 0 && (
          <section>
            <SectionHeader title="Son Değişiklikler" />
            <div className="space-y-2">
              {data.activity.map((a, i) => (
                <div key={i} className="text-sm flex items-baseline justify-between border-b py-2" style={{ borderColor: "#EDE6D0" }}>
                  <span><strong className="font-medium">{a.by || "Bilinmeyen"}</strong> {a.action}</span>
                  <span className="opacity-40 text-xs shrink-0 pl-3">{timeAgo(a.at)}</span>
                </div>
              ))}
            </div>
          </section>
        )}

        {/* Backup */}
        <section className="flex items-center gap-3 flex-wrap">
          <button onClick={exportBackup} className="text-xs px-3 py-1.5 rounded-full border" style={{ borderColor: LINE }}>Yedek İndir (JSON)</button>
          <button onClick={() => fileInputRef.current.click()} className="text-xs px-3 py-1.5 rounded-full border" style={{ borderColor: LINE }}>Yedekten Geri Yükle</button>
          <input ref={fileInputRef} type="file" accept="application/json" className="hidden"
            onChange={(e) => e.target.files[0] && importBackup(e.target.files[0])} />
        </section>

        <footer className="text-xs opacity-40 pt-2">
          🐷 Kendi tasarruflarınız (bozdurulan altın) burada izlenmez — o zaten ev alımında harcandı, bu araç sadece kalan borcunuzu takip eder.
          {syncStatus === "synced" || syncStatus === "saving"
            ? " Veriler Netlify üzerinde ortak bir kayıtta tutulur, hem siz hem eşiniz her cihazdan görüp güncelleyebilirsiniz (birkaç saniye içinde senkronize olur)."
            : " Ortak senkronizasyon şu an aktif değil — REHBER.md dosyasındaki Netlify Functions/Blobs adımlarını tamamlayın. O ana kadar veriler yalnızca bu tarayıcıda saklanır."}
        </footer>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
